<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<style>
:root{--bg:#f4f6fa;--paper:#fff;--ink:#182235;--muted:#657287;--border:#dce3ed;--radius:16px}*{box-sizing:border-box}html{scroll-padding-top:var(--nav-offset,85px)}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}a{color:#315bce;text-underline-offset:3px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:8px;background:white;padding:7px 12px;color:#344666}button:hover{border-color:#8099c4}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #315bce;outline-offset:3px}.primary{background:#344666;border-color:#344666;color:white}h1,h2,h3,h4{line-height:1.3}h2{margin:0 0 8px;font-size:25px}h3{margin:0 0 12px;font-size:18px}h4{margin:0 0 6px;font-size:15px}p{margin:8px 0 13px}.sub,.source{color:var(--muted);font-size:13px}.source{border-top:1px solid var(--border);padding-top:12px;margin-top:20px;overflow-wrap:anywhere}.section-number,.eyebrow{font-size:12px;font-weight:750;letter-spacing:.1em}.section-number{color:#8b98aa;margin-bottom:5px}.section-head{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:20px}
#poster-view{height:100dvh;display:flex;flex-direction:column}.poster-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:white;border-bottom:1px solid var(--border);padding:12px 20px}.poster-title{font-size:16px;font-weight:750;margin-right:auto}.poster-title span{font-weight:400;color:#8a98ac}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px}.tools label{display:flex;align-items:center;gap:6px}.tools input[type=range]{width:125px}#viewport{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;cursor:grab;background:#eaf0f6;padding:24px}#viewport.dragging{cursor:grabbing;user-select:none}#architecture-poster{display:block;max-width:none;margin:0 auto;background:white;box-shadow:0 8px 28px #26375112}#caption{background:white;border-top:1px solid var(--border);padding:8px 20px;color:var(--muted);font-size:12px;display:flex;gap:12px;justify-content:space-between}svg [data-detail]{cursor:pointer}
.hero{padding:48px max(24px,calc((100vw - 1320px)/2)) 34px;background:#15233c;color:white}.eyebrow{color:#a7c5fc}.hero h1{font-size:clamp(29px,4vw,48px);margin:10px 0 14px}.hero p{max-width:1020px;color:#d1dced}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:27px}.metric{border:1px solid #3c4c64;border-radius:12px;padding:14px 16px;min-width:0}.metric strong{display:block;font-size:25px}.metric span{display:block;font-size:12px;color:#c0cee1}.details-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(24px,calc((100vw - 1320px)/2));background:#fffffff7;border-bottom:1px solid var(--border)}.nav-links{display:flex;flex-wrap:wrap;gap:15px}.nav-links a{text-decoration:none;font-weight:650;font-size:13px}.details-nav .tools{margin-left:auto}#details-content{max-width:1368px;margin:auto;padding:24px;overflow-wrap:anywhere}#details-content>section{background:white;border:1px solid var(--border);border-radius:16px;padding:26px;margin-bottom:24px;scroll-margin-top:var(--nav-offset,85px)}#back-poster{position:fixed;right:20px;bottom:20px;z-index:10;box-shadow:0 5px 20px #18223530;padding:11px 17px}.grid2,.grid3,.grid4,.branch{display:grid;gap:18px;align-items:start}.grid2,.branch{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid var(--border);border-radius:12px;padding:18px;background:white;min-width:0}.node{border:1px solid var(--border);border-radius:9px;padding:12px 14px;text-align:center;background:#f9fafc;min-width:0}.node strong,.node .sub{display:block}.arrow{text-align:center;font-size:24px;color:#8b99ad;line-height:1.3;padding:7px}.flow-row{display:flex;gap:12px;align-items:stretch}.flow-row>.node{flex:1;min-width:0}.flow-row>.arrow{align-self:center}.diagram{max-width:100%;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:12px;background:white}.diagram svg{display:block;width:100%;min-width:var(--diagram-min-width,560px);height:auto}.disclosure{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:16px 0}.disclosure>summary{cursor:pointer;font-weight:650;color:#415168}.arrow small{display:block;font:12px/1.5 system-ui,sans-serif;color:var(--muted)}#details-content .shape,code{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}#details-content .shape{display:block;color:#526178;margin-top:5px;overflow-wrap:anywhere}pre,.formula{display:block;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;background:#f5f7fb;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;font:13px/1.9 ui-monospace,Consolas,monospace;margin:12px 0}.cache{background:#fff5f6;border:1px dashed #cf7182;border-radius:10px;padding:13px 15px;color:#973d50;font-size:13px}.note{border-left:4px solid #7892b8;padding:11px 15px;background:#f3f6fb;margin:16px 0;font-size:13px}.note.important{border-color:#bd7b20;background:#fff8ed}.tag{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:2px 9px;font-size:11px;margin:2px 5px 2px 0}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 20px}.legend span{padding:4px 11px;border-radius:7px;font-size:12px}.stack-box{border:2px solid #a7b8d1;border-radius:14px;padding:16px;background:#fbfcff}.stack-label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px}.table-wrap{overflow:auto;max-width:100%}table{border-collapse:collapse;max-width:100%;font-size:13px}th,td{border-bottom:1px solid var(--border);padding:10px 13px;text-align:left;vertical-align:top}th{background:#f0f4fa;color:#415168}tbody tr:nth-child(even){background:#fafbfd}.layer-grid{display:grid;grid-template-columns:repeat(var(--layer-columns,4),minmax(0,1fr));gap:7px}.layer-grid button{text-align:left;padding:10px;min-width:0;font-size:12px}.layer-grid button strong,.layer-grid button small{display:block}.layer-grid [aria-pressed=true]{outline:3px solid #344666;outline-offset:1px}.inspector{padding:15px;border-radius:10px;background:#f3f6fb;margin-top:16px}#details-view.hide-shapes .shape{display:none}#details-view.hide-caches .cache,#details-view.hide-caches .cache-label{display:none}@@THEME_CSS@@
[hidden]{display:none!important}@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.details-nav{padding:10px 20px}.details-nav .tools{margin-left:0}#details-content>section{scroll-margin-top:var(--nav-offset,85px)}}@media(max-width:620px){.hero{padding:30px 18px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:22px}.grid2,.grid3,.grid4,.branch{grid-template-columns:1fr}#details-content{padding:12px}#details-content>section{padding:18px}.poster-toolbar{padding:10px;gap:8px}.poster-title{width:100%;font-size:14px}.tools{gap:6px}.tools button{padding:5px 9px}.tools input[type=range]{width:95px}#viewport{padding:12px}#caption{padding:7px 12px}#caption .hint{display:none}.details-nav{position:relative;padding:12px}.nav-links{gap:12px}.layer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-row{flex-direction:column}.flow-row>.arrow{transform:rotate(90deg);padding:0}h2{font-size:22px}}@media print{body{background:white}.poster-toolbar,#caption,.details-nav,#back-poster{display:none!important}#poster-view{height:auto;display:block}#viewport{overflow:visible;padding:0;background:white}#architecture-poster{width:100%!important;height:auto!important;margin:0;box-shadow:none}.hero{padding:20px;background:#15233c!important;print-color-adjust:exact}.hero h1{font-size:32px}.metrics{grid-template-columns:repeat(3,1fr)}#details-content{max-width:none;padding:0}#details-content>section{border:0;border-radius:0;padding:16px 0;break-inside:auto}h2,h3{break-after:avoid}.card,.node,.formula,.cache,tr{break-inside:avoid}.grid2,.grid3,.grid4{display:block}.grid2>.card,.grid3>.card,.grid4>.card{margin-bottom:12px}a{color:inherit}table{font-size:11px}.diagram{overflow:visible}.diagram svg{min-width:0;width:100%}.disclosure{border:0;padding:0}.source{overflow-wrap:anywhere}*{print-color-adjust:exact}}
</style><noscript><style>#poster-view{display:none!important}#details-view[hidden]{display:block!important}#back-poster,.details-nav .tools{display:none!important}</style></noscript></head><body>
<div id="poster-view"><div class="poster-toolbar"><div class="poster-title">@@MODEL@@ <span>/ Architecture Atlas</span></div><div class="tools">
<button id="fit-width">适配宽度</button><button id="fit-all">查看全图</button><button id="actual-size">100%</button><label>缩放 <input id="zoom" type="range" min="5" max="200" value="100" aria-label="海报缩放"></label><output id="zoom-value">100%</output><button id="export-svg">导出 SVG</button><button id="export-png">导出 PNG ×2</button><button id="print-poster">打印 / PDF</button><button id="show-details" class="primary">阅读详解</button></div></div>
<div id="viewport" tabindex="0" aria-label="架构图画布，可滚动与拖拽">@@POSTER@@</div><div id="caption"><span id="poster-status">@@CAPTION@@</span><span class="hint">拖拽平移 · Ctrl/⌘ + 滚轮缩放 · 双击模块查看详解</span></div></div>
<div id="details-view" hidden><header class="hero"><div class="eyebrow">ARCHITECTURE ATLAS · @@EYEBROW@@</div><h1>@@MODEL@@</h1><p>@@SUMMARY@@</p><div class="metrics">@@METRICS@@</div></header>
<nav class="details-nav" aria-label="模块导航"><div class="nav-links">@@NAV@@</div><div class="tools"><label><input id="toggle-shapes" type="checkbox" checked> 张量形状</label><label><input id="toggle-caches" type="checkbox" checked> 缓存标注</label><button id="print-details">打印 / PDF</button></div></nav>
<main id="details-content">@@DETAILS@@</main><button id="back-poster" class="primary">返回架构海报</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),svg=$('architecture-poster'),vb=svg.viewBox.baseVal,view=$('viewport');const w=vb.width,h=vb.height;let currentScale=1,lastFocused=null,fitMode='width';
function scale(value,anchor){const z=Math.max(.05,Math.min(2,value));let point=null;if(anchor){const r=svg.getBoundingClientRect(),v=view.getBoundingClientRect();point={x:(v.left+anchor.x-r.left)/currentScale,y:(v.top+anchor.y-r.top)/currentScale};}currentScale=z;svg.style.width=w*z+'px';svg.style.height=h*z+'px';$('zoom').value=z*100;$('zoom-value').textContent=Math.round(z*100)+'%';if(point){const r=svg.getBoundingClientRect(),v=view.getBoundingClientRect();view.scrollLeft+=r.left+point.x*z-v.left-anchor.x;view.scrollTop+=r.top+point.y*z-v.top-anchor.y;}}
function fit(all=false){fitMode=all?'all':'width';const cs=getComputedStyle(view),px=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),py=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);scale(Math.min((view.clientWidth-px-2)/w,all?(view.clientHeight-py-2)/h:2));view.scrollTo(0,0);}
function details(id){lastFocused=document.activeElement;$('poster-view').hidden=true;$('details-view').hidden=false;requestAnimationFrame(()=>{if(id)$(id)?.scrollIntoView();else window.scrollTo(0,0);});}
$('show-details').onclick=()=>details();$('back-poster').onclick=()=>{$('details-view').hidden=true;$('poster-view').hidden=false;window.scrollTo(0,0);lastFocused?.focus({preventScroll:true});};$('fit-width').onclick=()=>fit();$('fit-all').onclick=()=>fit(true);$('actual-size').onclick=()=>{fitMode=null;scale(1);};$('zoom').oninput=e=>{fitMode=null;scale(Number(e.target.value)/100);};$('print-poster').onclick=$('print-details').onclick=()=>window.print();
svg.querySelectorAll('[data-detail]').forEach(node=>{node.addEventListener('dblclick',()=>details(node.dataset.detail));node.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();details(node.dataset.detail);}});});
$('toggle-shapes').onchange=e=>$('details-view').classList.toggle('hide-shapes',!e.target.checked);$('toggle-caches').onchange=e=>$('details-view').classList.toggle('hide-caches',!e.target.checked);
view.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();fitMode=null;const r=view.getBoundingClientRect();scale(currentScale*Math.exp(-e.deltaY*.002),{x:e.clientX-r.left,y:e.clientY-r.top});}},{passive:false});
let drag=null;view.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)drag={x:e.clientX,y:e.clientY,left:view.scrollLeft,top:view.scrollTop,moved:false};});view.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)<5)return;drag.moved=true;if(!view.hasPointerCapture(e.pointerId))view.setPointerCapture(e.pointerId);view.classList.add('dragging');view.scrollLeft=drag.left-dx;view.scrollTop=drag.top-dy;});function end(e){if(view.hasPointerCapture(e.pointerId))view.releasePointerCapture(e.pointerId);view.classList.remove('dragging');drag=null;}view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
document.querySelectorAll('[data-layer-grid]').forEach(grid=>{const inspector=$(grid.dataset.inspector);grid.querySelectorAll('[data-layer-info]').forEach(button=>{button.onclick=()=>{grid.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');if(inspector)inspector.textContent=button.dataset.layerInfo;};});});
const nav=document.querySelector('.details-nav');function navOffset(){if(!nav)return;document.documentElement.style.setProperty('--nav-offset',(nav.getBoundingClientRect().height+20)+'px');}new ResizeObserver(navOffset).observe(nav);
window.addEventListener('resize',()=>{if(!$('poster-view').hidden&&fitMode)fit(fitMode==='all');});
let closedDisclosures=[];window.addEventListener('beforeprint',()=>{closedDisclosures=[...document.querySelectorAll('.disclosure:not([open])')];closedDisclosures.forEach(d=>d.open=true);});window.addEventListener('afterprint',()=>{closedDisclosures.forEach(d=>d.open=false);closedDisclosures=[];});
function snapshot(){const clone=svg.cloneNode(true);clone.removeAttribute('style');clone.setAttribute('width',w);clone.setAttribute('height',h);clone.querySelectorAll('.is-selected').forEach(n=>n.classList.remove('is-selected'));return new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'});}
function download(blob,ext){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='@@FILE_STEM@@.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}$('export-svg').onclick=()=>download(snapshot(),'svg');$('export-png').onclick=async()=>{const button=$('export-png');button.disabled=true;const url=URL.createObjectURL(snapshot());try{const image=new Image();image.src=url;await image.decode();const canvas=document.createElement('canvas');canvas.width=Math.round(w*2);canvas.height=Math.round(h*2);const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG export failed');download(blob,'png');}catch(e){console.error(e);alert('导出失败：'+e.message);}finally{URL.revokeObjectURL(url);button.disabled=false;}};requestAnimationFrame(()=>fit(false));})();
</script></body></html>
